<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#1e293b">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="color-scheme" content="light dark">
    <title>Orçamento <span id="yearTitle">2026</span></title>
    
    <!-- Ícone do App para iOS e Android -->
    <link rel="icon" type="image/png" href="orcamento-icon.png">
    <link rel="shortcut icon" href="orcamento-icon.png">
    <link rel="apple-touch-icon" href="orcamento-icon.png">
    <link rel="apple-touch-icon" sizes="152x152" href="orcamento-icon.png">
    <link rel="apple-touch-icon" sizes="180x180" href="orcamento-icon.png">
    <link rel="apple-touch-icon" sizes="167x167" href="orcamento-icon.png">
    
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        :root {
            /* Cores base que serão sobrescritas */
            --primary: #334155;
            --primary-light: #475569;
            --secondary: #64748b;
            --accent: #94a3b8;
            --success: #059669;
            --success-light: #10b981;
            --danger: #dc2626;
            --warning: #d97706;
            --bg-dark: #0f172a;
            --bg-card: #1e293b;
            --bg-hover: #334155;
            --text-primary: #f1f5f9;
            --text-secondary: #94a3b8;
            --border: #334155;
            --input-bg: #0f172a;
            --paid-bg: rgba(5, 150, 105, 0.1);
            --paid-border: #059669;
            --shadow-color: rgba(0, 0, 0, 0.4);
            --gradient-start: var(--bg-dark);
            --gradient-end: #020617;
        }

        /* Tema Claro */
        [data-theme="light"] {
            --primary: #3b82f6;
            --primary-light: #60a5fa;
            --secondary: #6b7280;
            --accent: #8b5cf6;
            --success: #059669;
            --success-light: #10b981;
            --danger: #ef4444;
            --warning: #f59e0b;
            --bg-dark: #f8fafc;
            --bg-card: #ffffff;
            --bg-hover: #f1f5f9;
            --text-primary: #1e293b;
            --text-secondary: #64748b;
            --border: #e2e8f0;
            --input-bg: #f8fafc;
            --paid-bg: rgba(5, 150, 105, 0.05);
            --paid-border: #059669;
            --shadow-color: rgba(0, 0, 0, 0.1);
            --gradient-start: #f8fafc;
            --gradient-end: #e2e8f0;
        }

        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background: linear-gradient(180deg, var(--gradient-start) 0%, var(--gradient-end) 100%);
            color: var(--text-primary);
            min-height: 100vh;
            overflow-x: hidden;
            padding-bottom: 100px;
            transition: background 0.3s ease, color 0.3s ease;
        }

        /* Header */
        .header {
            background: linear-gradient(180deg, var(--bg-card) 0%, rgba(255, 255, 255, 0.1) 100%);
            padding: 20px;
            position: sticky;
            top: 0;
            z-index: 100;
            box-shadow: 0 4px 20px var(--shadow-color);
            border-bottom: 1px solid var(--border);
            backdrop-filter: blur(10px);
            transition: all 0.3s ease;
        }

        .header-content {
            max-width: 900px;
            margin: 0 auto;
        }

        .header-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            flex-wrap: wrap;
            gap: 10px;
        }

        .header h1 {
            font-size: 1.4rem;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 10px;
            color: var(--text-primary);
            letter-spacing: 0.3px;
        }

        .year-input {
            background: var(--input-bg);
            border: 1px solid var(--border);
            color: var(--text-primary);
            padding: 4px 8px;
            border-radius: 6px;
            font-size: 1.4rem;
            font-weight: 600;
            width: 80px;
            text-align: center;
            font-family: inherit;
            transition: all 0.3s ease;
        }

        .year-input:focus {
            outline: none;
            border-color: var(--accent);
            box-shadow: 0 0 0 3px rgba(139, 92, 246, 0.1);
        }

        .header-buttons {
            display: flex;
            gap: 10px;
            align-items: center;
        }

        .chart-btn, .theme-btn {
            background: var(--bg-hover);
            border: 1px solid var(--border);
            color: var(--text-primary);
            padding: 8px 16px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 0.85rem;
            font-weight: 500;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .chart-btn:hover, .theme-btn:hover {
            background: var(--primary-light);
            border-color: var(--accent);
            transform: translateY(-2px);
        }

        .theme-btn {
            padding: 8px 12px;
            font-size: 1.1rem;
        }

        .month-selector {
            display: flex;
            gap: 8px;
            overflow-x: auto;
            padding-bottom: 5px;
            scrollbar-width: none;
            -ms-overflow-style: none;
        }

        .month-selector::-webkit-scrollbar {
            display: none;
        }

        .month-btn {
            background: rgba(148, 163, 184, 0.1);
            border: 1px solid var(--border);
            color: var(--text-secondary);
            padding: 8px 14px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 0.85rem;
            font-weight: 500;
            white-space: nowrap;
            transition: all 0.3s ease;
        }

        .month-btn:hover {
            background: rgba(148, 163, 184, 0.2);
            border-color: var(--accent);
            color: var(--text-primary);
        }

        .month-btn.active {
            background: var(--primary);
            border-color: var(--accent);
            color: white;
            box-shadow: 0 4px 15px var(--shadow-color);
        }

        /* Main Content */
        .container {
            max-width: 900px;
            margin: 0 auto;
            padding: 20px;
        }

        .view-section {
            display: none;
            animation: fadeIn 0.4s ease;
        }

        .view-section.active {
            display: block;
        }

        /* Month Sections */
        .month-section {
            display: none;
        }

        .month-section.active {
            display: block;
            animation: fadeIn 0.4s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Summary Cards */
        .summary-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
            margin-bottom: 20px;
        }

        @media (min-width: 600px) {
            .summary-grid {
                grid-template-columns: repeat(4, 1fr);
            }
        }

        .summary-card {
            background: var(--bg-card);
            border-radius: 12px;
            padding: 16px;
            border: 1px solid var(--border);
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
            box-shadow: 0 2px 10px var(--shadow-color);
        }

        .summary-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 3px;
            background: var(--secondary);
        }

        .summary-card.income::before { background: var(--success); }
        .summary-card.expense::before { background: var(--danger); }
        .summary-card.balance::before { background: var(--accent); }
        .summary-card.percentage::before { background: var(--warning); }

        .summary-card:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 25px var(--shadow-color);
            border-color: var(--primary-light);
        }

        .card-label {
            font-size: 0.75rem;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 0.8px;
            margin-bottom: 6px;
            font-weight: 600;
        }

        .card-value {
            font-size: 1.2rem;
            font-weight: 700;
            color: var(--text-primary);
            font-family: 'Courier New', monospace;
        }

        .card-value.positive { color: var(--success); }
        .card-value.negative { color: var(--danger); }
        .card-value.warning { color: var(--warning); }

        /* Progress Bar */
        .progress-container {
            background: var(--bg-card);
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 20px;
            border: 1px solid var(--border);
            box-shadow: 0 2px 10px var(--shadow-color);
        }

        .progress-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }

        .progress-title {
            font-size: 0.9rem;
            font-weight: 600;
            color: var(--text-secondary);
        }

        .progress-percentage {
            font-size: 1.1rem;
            font-weight: 700;
            color: var(--accent);
            font-family: 'Courier New', monospace;
        }

        .progress-bar {
            height: 8px;
            background: var(--input-bg);
            border-radius: 4px;
            overflow: hidden;
            position: relative;
            border: 1px solid var(--border);
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, var(--success) 0%, var(--warning) 60%, var(--danger) 100%);
            border-radius: 4px;
            transition: width 1s ease;
        }

        /* Lists */
        .list-container {
            background: var(--bg-card);
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 20px;
            border: 1px solid var(--border);
            box-shadow: 0 2px 10px var(--shadow-color);
        }

        .list-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
            padding-bottom: 12px;
            border-bottom: 1px solid var(--border);
        }

        .list-title-group {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .list-title {
            font-size: 1.1rem;
            font-weight: 600;
            color: var(--text-primary);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .add-btn-small {
            background: var(--primary);
            border: 1px solid var(--border);
            color: white;
            width: 28px;
            height: 28px;
            border-radius: 50%;
            cursor: pointer;
            font-size: 1.2rem;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s ease;
        }

        .add-btn-small:hover {
            background: var(--primary-light);
            border-color: var(--accent);
            transform: scale(1.1);
        }

        .list-total {
            font-size: 1.1rem;
            font-weight: 700;
            color: var(--text-primary);
            font-family: 'Courier New', monospace;
        }

        .item {
            display: flex;
            align-items: center;
            padding: 12px;
            margin-bottom: 8px;
            background: rgba(148, 163, 184, 0.05);
            border-radius: 8px;
            border: 1px solid transparent;
            transition: all 0.3s ease;
            gap: 12px;
        }

        .item:hover {
            background: rgba(148, 163, 184, 0.1);
            border-color: var(--border);
        }

        .item.paid {
            background: var(--paid-bg);
            border-color: var(--paid-border);
            opacity: 0.9;
        }

        .item.paid .item-name {
            text-decoration: line-through;
            color: var(--success);
        }

        .item.paid .item-value-input {
            color: var(--success);
        }

        .checkbox-wrapper {
            position: relative;
            width: 24px;
            height: 24px;
            flex-shrink: 0;
        }

        .checkbox {
            width: 24px;
            height: 24px;
            border: 2px solid var(--border);
            border-radius: 6px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s ease;
            background: var(--input-bg);
        }

        .checkbox:hover {
            border-color: var(--success);
        }

        .checkbox.checked {
            background: var(--success);
            border-color: var(--success);
        }

        .checkbox.checked::after {
            content: '✓';
            color: white;
            font-size: 14px;
            font-weight: bold;
        }

        .item-info {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .item-name {
            font-weight: 500;
            font-size: 0.95rem;
            color: var(--text-primary);
            transition: all 0.3s ease;
        }

        .item-input {
            background: var(--input-bg);
            border: 1px solid var(--border);
            color: var(--text-primary);
            padding: 6px 10px;
            border-radius: 6px;
            font-size: 0.9rem;
            width: 100%;
            font-family: inherit;
            transition: all 0.3s ease;
        }

        .item-input:focus {
            outline: none;
            border-color: var(--accent);
            box-shadow: 0 0 0 3px rgba(139, 92, 246, 0.1);
        }

        .item-value-wrapper {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .item-value-input {
            background: var(--input-bg);
            border: 1px solid var(--border);
            color: var(--text-primary);
            padding: 6px 10px;
            border-radius: 6px;
            font-size: 0.9rem;
            width: 100px;
            text-align: right;
            font-family: 'Courier New', monospace;
            transition: all 0.3s ease;
        }

        .item-value-input:focus {
            outline: none;
            border-color: var(--accent);
            box-shadow: 0 0 0 3px rgba(139, 92, 246, 0.1);
        }

        .item-actions {
            display: flex;
            gap: 6px;
        }

        .item-btn {
            background: transparent;
            border: 1px solid var(--border);
            color: var(--text-secondary);
            width: 32px;
            height: 32px;
            border-radius: 6px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s ease;
            font-size: 0.9rem;
        }

        .item-btn:hover {
            background: var(--bg-hover);
            color: var(--text-primary);
            border-color: var(--accent);
        }

        .item-btn.delete:hover {
            color: var(--danger);
            border-color: var(--danger);
        }

        .paid-badge {
            font-size: 0.7rem;
            background: var(--success);
            color: white;
            padding: 2px 8px;
            border-radius: 12px;
            font-weight: 600;
            margin-left: 8px;
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .item.paid .paid-badge {
            opacity: 1;
        }

        /* Charts Page */
        .charts-container {
            background: var(--bg-card);
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 20px;
            border: 1px solid var(--border);
            box-shadow: 0 2px 10px var(--shadow-color);
        }

        .chart-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .chart-title {
            font-size: 1.2rem;
            font-weight: 600;
            color: var(--text-primary);
        }

        .back-btn {
            background: var(--bg-hover);
            border: 1px solid var(--border);
            color: var(--text-primary);
            padding: 8px 16px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 0.85rem;
            transition: all 0.3s ease;
        }

        .back-btn:hover {
            background: var(--primary);
            border-color: var(--accent);
            color: white;
        }

        .chart-wrapper {
            position: relative;
            height: 300px;
            margin-bottom: 30px;
        }

        .chart-label {
            text-align: center;
            margin-bottom: 10px;
            color: var(--text-secondary);
            font-size: 0.9rem;
            font-weight: 600;
        }

        /* Modal */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(5px);
            z-index: 200;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .modal.active {
            display: flex;
            animation: fadeIn 0.3s ease;
        }

        .modal-content {
            background: var(--bg-card);
            border-radius: 16px;
            padding: 24px;
            width: 100%;
            max-width: 400px;
            border: 1px solid var(--border);
            box-shadow: 0 20px 60px var(--shadow-color);
        }

        .modal-header {
            font-size: 1.2rem;
            font-weight: 600;
            margin-bottom: 20px;
            text-align: center;
            color: var(--text-primary);
        }

        .form-group {
            margin-bottom: 16px;
        }

        .form-label {
            display: block;
            margin-bottom: 6px;
            font-size: 0.85rem;
            color: var(--text-secondary);
            font-weight: 600;
        }

        .form-input, .form-select {
            width: 100%;
            padding: 10px 14px;
            background: var(--input-bg);
            border: 1px solid var(--border);
            border-radius: 8px;
            color: var(--text-primary);
            font-size: 0.95rem;
            transition: all 0.3s ease;
            font-family: inherit;
        }

        .form-input:focus, .form-select:focus {
            outline: none;
            border-color: var(--accent);
            box-shadow: 0 0 0 3px rgba(139, 92, 246, 0.1);
        }

        .form-actions {
            display: flex;
            gap: 10px;
            margin-top: 20px;
        }

        .btn {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 8px;
            font-size: 0.95rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .btn-primary {
            background: var(--primary);
            color: white;
            border: 1px solid var(--border);
        }

        .btn-primary:hover {
            background: var(--primary-light);
            border-color: var(--accent);
            transform: translateY(-2px);
        }

        .btn-secondary {
            background: var(--bg-hover);
            color: var(--text-secondary);
            border: 1px solid var(--border);
        }

        .btn-secondary:hover {
            background: var(--border);
            color: var(--text-primary);
        }

        /* Empty State */
        .empty-state {
            text-align: center;
            padding: 30px 20px;
            color: var(--text-secondary);
        }

        .empty-icon {
            font-size: 2.5rem;
            margin-bottom: 10px;
            opacity: 0.5;
        }

        /* Toast Notification */
        .toast {
            position: fixed;
            bottom: 100px;
            left: 50%;
            transform: translateX(-50%) translateY(100px);
            background: var(--bg-card);
            color: var(--text-primary);
            padding: 12px 24px;
            border-radius: 25px;
            border: 1px solid var(--success);
            font-size: 0.9rem;
            font-weight: 500;
            opacity: 0;
            transition: all 0.3s ease;
            z-index: 300;
            box-shadow: 0 4px 20px var(--shadow-color);
        }

        .toast.show {
            transform: translateX(-50%) translateY(0);
            opacity: 1;
        }

        /* Scrollbar */
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }

        ::-webkit-scrollbar-track {
            background: var(--bg-dark);
        }

        ::-webkit-scrollbar-thumb {
            background: var(--border);
            border-radius: 3px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: var(--secondary);
        }

        /* Stats summary for charts */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
            margin-bottom: 20px;
        }

        .stat-box {
            background: rgba(148, 163, 184, 0.05);
            padding: 15px;
            border-radius: 8px;
            text-align: center;
            border: 1px solid var(--border);
        }

        .stat-label {
            font-size: 0.75rem;
            color: var(--text-secondary);
            margin-bottom: 5px;
            text-transform: uppercase;
        }

        .stat-value {
            font-size: 1.1rem;
            font-weight: 700;
            font-family: 'Courier New', monospace;
        }

        .stat-value.income { color: var(--success); }
        .stat-value.expense { color: var(--danger); }
        .stat-value.balance { color: var(--accent); }

        /* Responsividade */
        @media (max-width: 480px) {
            .header-top {
                flex-direction: column;
                align-items: flex-start;
            }
            
            .header-buttons {
                width: 100%;
                justify-content: flex-end;
            }
        }
    </style>
</head>
<body>
    <header class="header">
        <div class="header-content">
            <div class="header-top">
                <h1>📊 Orçamento <input type="number" class="year-input" id="yearInput" value="2026" onchange="updateYear(this.value)"></h1>
                <div class="header-buttons">
                    <button class="theme-btn" onclick="toggleTheme()" title="Alternar tema" id="themeBtn">
                        ☀️
                    </button>
                    <button class="chart-btn" onclick="showCharts()">
                        📈 Gráficos
                    </button>
                </div>
            </div>
            <div class="month-selector" id="monthSelector"></div>
        </div>
    </header>

    <main class="container">
        <!-- Budget View -->
        <div id="budgetView" class="view-section active">
            <div id="monthsContainer"></div>
        </div>

        <!-- Charts View -->
        <div id="chartsView" class="view-section">
            <div class="charts-container">
                <div class="chart-header">
                    <h2 class="chart-title">Análise Anual <span id="chartYear">2026</span></h2>
                    <button class="back-btn" onclick="showBudget()">← Voltar</button>
                </div>

                <div class="stats-grid">
                    <div class="stat-box">
                        <div class="stat-label">Receita Total</div>
                        <div class="stat-value income" id="totalYearIncome">R$ 0,00</div>
                    </div>
                    <div class="stat-box">
                        <div class="stat-label">Despesa Total</div>
                        <div class="stat-value expense" id="totalYearExpense">R$ 0,00</div>
                    </div>
                    <div class="stat-box">
                        <div class="stat-label">Saldo Anual</div>
                        <div class="stat-value balance" id="totalYearBalance">R$ 0,00</div>
                    </div>
                </div>
                
                <div class="chart-label">📈 Evolução das Receitas Mensais</div>
                <div class="chart-wrapper">
                    <canvas id="incomeChart"></canvas>
                </div>
                
                <div class="chart-label">📉 Evolução das Despesas Mensais</div>
                <div class="chart-wrapper">
                    <canvas id="expenseChart"></canvas>
                </div>
            </div>
        </div>
    </main>

    <!-- Add Modal -->
    <div class="modal" id="addModal">
        <div class="modal-content">
            <h2 class="modal-header">Adicionar Item</h2>
            <form id="addForm">
                <div class="form-group">
                    <label class="form-label">Mês</label>
                    <select class="form-select" id="addMonth"></select>
                </div>
                <div class="form-group">
                    <label class="form-label">Tipo</label>
                    <select class="form-select" id="addType" onchange="updateAddCategories()">
                        <option value="income">Receita</option>
                        <option value="expense">Despesa</option>
                    </select>
                </div>
                <div class="form-group">
                    <label class="form-label">Categoria</label>
                    <select class="form-select" id="addCategory"></select>
                </div>
                <div class="form-group">
                    <label class="form-label">Descrição (opcional)</label>
                    <input type="text" class="form-input" id="addDescription" placeholder="Ex: Extra, Bônus...">
                </div>
                <div class="form-group">
                    <label class="form-label">Valor (R$)</label>
                    <input type="number" class="form-input" id="addValue" placeholder="0,00" step="0.01" required>
                </div>
                <div class="form-actions">
                    <button type="button" class="btn btn-secondary" onclick="closeAddModal()">Cancelar</button>
                    <button type="submit" class="btn btn-primary">Adicionar</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Toast -->
    <div class="toast" id="toast"></div>

    <script>
        // Data structure with paid status for expenses
        const months = ['Janeiro', 'Fevereiro', 'Março', 'Abril', 'Maio', 'Junho', 
                       'Julho', 'Agosto', 'Setembro', 'Outubro', 'Novembro', 'Dezembro'];
        
        const categories = {
            income: ['PM BASE', 'PM EXTRA', 'Outros EXTRAS', 'Laryssa', 'Cláudia', 'Adeilton', 'Alba', 'NUFAP'],
            expense: ['Santander/Caixa', 'Eletricidade', 'Água', 'Telefone celular', 'Internet', 
                     'Parcela do carro', 'Aluguel do Sítio', 'Tv box', 'Cartão santander', 
                     'Oferta', 'Fatura do Cartão', 'Grêmios', 'Cartão BV', 'Cartão Magalu', 
                     'Cartão Bradesco', 'Inglês', 'Latim', 'Academia']
        };

        // Empty initial data structure
        const initialData = {
            0: { income: [], expenses: [] },
            1: { income: [], expenses: [] },
            2: { income: [], expenses: [] },
            3: { income: [], expenses: [] },
            4: { income: [], expenses: [] },
            5: { income: [], expenses: [] },
            6: { income: [], expenses: [] },
            7: { income: [], expenses: [] },
            8: { income: [], expenses: [] },
            9: { income: [], expenses: [] },
            10: { income: [], expenses: [] },
            11: { income: [], expenses: [] }
        };

        let budgetData = JSON.parse(localStorage.getItem('budget2026_v2')) || JSON.parse(JSON.stringify(initialData));
        let currentYear = localStorage.getItem('budgetYear') || '2026';
        let currentMonth = new Date().getMonth();
        if (currentMonth > 11) currentMonth = 0;
        let incomeChart, expenseChart;
        let currentTheme = localStorage.getItem('theme2026') || 'dark';

        function saveData() {
            localStorage.setItem('budget2026_v2', JSON.stringify(budgetData));
            localStorage.setItem('budgetYear', currentYear);
        }

        function formatCurrency(value) {
            return new Intl.NumberFormat('pt-BR', {
                style: 'currency',
                currency: 'BRL'
            }).format(value);
        }

        function showToast(message) {
            const toast = document.getElementById('toast');
            toast.textContent = message;
            toast.classList.add('show');
            setTimeout(() => toast.classList.remove('show'), 3000);
        }

        // Theme functions
        function initTheme() {
            document.documentElement.setAttribute('data-theme', currentTheme);
            updateThemeButton();
        }

        function toggleTheme() {
            currentTheme = currentTheme === 'dark' ? 'light' : 'dark';
            document.documentElement.setAttribute('data-theme', currentTheme);
            localStorage.setItem('theme2026', currentTheme);
            updateThemeButton();
            showToast(`Tema ${currentTheme === 'dark' ? 'escuro' : 'claro'} ativado`);
            
            // Atualizar gráficos se estiverem visíveis
            if (document.getElementById('chartsView').classList.contains('active')) {
                updateCharts();
            }
        }

        function updateThemeButton() {
            const btn = document.getElementById('themeBtn');
            btn.textContent = currentTheme === 'dark' ? '☀️' : '🌙';
            btn.title = `Mudar para tema ${currentTheme === 'dark' ? 'claro' : 'escuro'}`;
        }

        function updateYear(year) {
            currentYear = year;
            document.getElementById('chartYear').textContent = year;
            document.title = `Orçamento ${year}`;
            saveData();
            showToast(`Ano alterado para ${year}`);
        }

        function init() {
            initTheme();
            document.getElementById('yearInput').value = currentYear;
            document.getElementById('chartYear').textContent = currentYear;
            document.title = `Orçamento ${currentYear}`;
            renderMonthSelector();
            renderAllMonths();
            showMonth(currentMonth);
            updateAddCategories();
            populateMonthSelect();
        }

        function renderMonthSelector() {
            const selector = document.getElementById('monthSelector');
            months.forEach((month, index) => {
                const btn = document.createElement('button');
                btn.className = 'month-btn';
                btn.textContent = month.substring(0, 3);
                btn.onclick = () => showMonth(index);
                if (index === currentMonth) btn.classList.add('active');
                selector.appendChild(btn);
            });
        }

        function renderAllMonths() {
            const container = document.getElementById('monthsContainer');
            months.forEach((month, index) => {
                const section = document.createElement('div');
                section.className = 'month-section';
                section.id = `month-${index}`;
                section.innerHTML = generateMonthHTML(index);
                container.appendChild(section);
            });
        }

        function calculateMonthTotals(monthIndex) {
            const data = budgetData[monthIndex];
            const totalIncome = data.income.reduce((sum, item) => sum + (parseFloat(item.value) || 0), 0);
            const totalExpense = data.expenses.reduce((sum, item) => sum + (parseFloat(item.value) || 0), 0);
            const balance = totalIncome - totalExpense;
            const percentage = totalIncome > 0 ? (totalExpense / totalIncome * 100).toFixed(1) : 0;
            return { totalIncome, totalExpense, balance, percentage };
        }

        function generateMonthHTML(monthIndex) {
            const { totalIncome, totalExpense, balance, percentage } = calculateMonthTotals(monthIndex);
            const data = budgetData[monthIndex];

            return `
                <div class="summary-grid">
                    <div class="summary-card income">
                        <div class="card-label">Receita Total</div>
                        <div class="card-value">${formatCurrency(totalIncome)}</div>
                    </div>
                    <div class="summary-card expense">
                        <div class="card-label">Despesa Total</div>
                        <div class="card-value">${formatCurrency(totalExpense)}</div>
                    </div>
                    <div class="summary-card balance">
                        <div class="card-label">Saldo</div>
                        <div class="card-value ${balance >= 0 ? 'positive' : 'negative'}">${formatCurrency(balance)}</div>
                    </div>
                    <div class="summary-card percentage">
                        <div class="card-label">% Gasto</div>
                        <div class="card-value ${percentage > 80 ? 'negative' : percentage > 60 ? 'warning' : 'positive'}">${percentage}%</div>
                    </div>
                </div>

                <div class="progress-container">
                    <div class="progress-header">
                        <span class="progress-title">Percentual da Renda Gasta</span>
                        <span class="progress-percentage">${percentage}%</span>
                    </div>
                    <div class="progress-bar">
                        <div class="progress-fill" style="width: ${Math.min(percentage, 100)}%"></div>
                    </div>
                </div>

                <div class="list-container">
                    <div class="list-header">
                        <div class="list-title-group">
                            <span class="list-title">💵 Receitas</span>
                            <button class="add-btn-small" onclick="openAddModal(${monthIndex}, 'income')">+</button>
                        </div>
                        <span class="list-total">${formatCurrency(totalIncome)}</span>
                    </div>
                    ${data.income.length === 0 ? 
                        '<div class="empty-state"><div class="empty-icon">💸</div><p>Nenhuma receita cadastrada</p></div>' :
                        data.income.map((item, idx) => `
                            <div class="item">
                                <div class="item-info" style="flex: 1;">
                                    <input type="text" class="item-input" value="${item.name}" 
                                        onchange="updateItemName(${monthIndex}, 'income', ${idx}, this.value)"
                                        placeholder="Descrição">
                                </div>
                                <div class="item-value-wrapper">
                                    <input type="number" class="item-value-input" value="${item.value}" 
                                        onchange="updateItemValue(${monthIndex}, 'income', ${idx}, this.value)"
                                        placeholder="0,00" step="0.01">
                                </div>
                                <div class="item-actions">
                                    <button class="item-btn delete" onclick="deleteItem(${monthIndex}, 'income', ${idx})">🗑</button>
                                </div>
                            </div>
                        `).join('')}
                </div>

                <div class="list-container">
                    <div class="list-header">
                        <div class="list-title-group">
                            <span class="list-title">💳 Despesas</span>
                            <button class="add-btn-small" onclick="openAddModal(${monthIndex}, 'expense')">+</button>
                        </div>
                        <span class="list-total">${formatCurrency(totalExpense)}</span>
                    </div>
                    ${data.expenses.length === 0 ? 
                        '<div class="empty-state"><div class="empty-icon">📝</div><p>Nenhuma despesa cadastrada</p></div>' :
                        data.expenses.map((item, idx) => `
                            <div class="item ${item.paid ? 'paid' : ''}">
                                <div class="checkbox-wrapper" onclick="togglePaid(${monthIndex}, ${idx})">
                                    <div class="checkbox ${item.paid ? 'checked' : ''}"></div>
                                </div>
                                <div class="item-info" style="flex: 1;">
                                    <div style="display: flex; align-items: center;">
                                        <input type="text" class="item-input" value="${item.name}" 
                                            onchange="updateItemName(${monthIndex}, 'expenses', ${idx}, this.value)"
                                            placeholder="Descrição">
                                        ${item.paid ? '<span class="paid-badge">PAGO</span>' : ''}
                                    </div>
                                </div>
                                <div class="item-value-wrapper">
                                    <input type="number" class="item-value-input" value="${item.value}" 
                                        onchange="updateItemValue(${monthIndex}, 'expenses', ${idx}, this.value)"
                                        placeholder="0,00" step="0.01">
                                </div>
                                <div class="item-actions">
                                    <button class="item-btn delete" onclick="deleteItem(${monthIndex}, 'expenses', ${idx})">🗑</button>
                                </div>
                            </div>
                        `).join('')}
                </div>
            `;
        }

        function showMonth(index) {
            currentMonth = index;
            document.querySelectorAll('.month-section').forEach(section => {
                section.classList.remove('active');
            });
            document.getElementById(`month-${index}`).classList.add('active');
            
            document.querySelectorAll('.month-btn').forEach((btn, idx) => {
                btn.classList.toggle('active', idx === index);
            });
        }

        function updateItemName(month, type, index, value) {
            budgetData[month][type][index].name = value;
            saveData();
            showToast('Descrição atualizada');
        }

        function updateItemValue(month, type, index, value) {
            budgetData[month][type][index].value = parseFloat(value) || 0;
            saveData();
            refreshMonthView(month);
            showToast('Valor atualizado');
        }

        function togglePaid(month, index) {
            budgetData[month].expenses[index].paid = !budgetData[month].expenses[index].paid;
            saveData();
            refreshMonthView(month);
            const status = budgetData[month].expenses[index].paid ? 'paga' : 'não paga';
            showToast(`Conta marcada como ${status}`);
        }

        function deleteItem(month, type, index) {
            if (confirm('Deseja remover este item?')) {
                budgetData[month][type].splice(index, 1);
                saveData();
                refreshMonthView(month);
                showToast('Item removido');
            }
        }

        function refreshMonthView(month) {
            const section = document.getElementById(`month-${month}`);
            section.innerHTML = generateMonthHTML(month);
        }

        function openAddModal(month, type) {
            document.getElementById('addModal').classList.add('active');
            document.getElementById('addMonth').value = month;
            document.getElementById('addType').value = type;
            updateAddCategories();
            document.getElementById('addValue').focus();
        }

        function closeAddModal() {
            document.getElementById('addModal').classList.remove('active');
            document.getElementById('addForm').reset();
        }

        function populateMonthSelect() {
            const select = document.getElementById('addMonth');
            select.innerHTML = months.map((m, i) => `<option value="${i}">${m}</option>`).join('');
        }

        function updateAddCategories() {
            const type = document.getElementById('addType').value;
            const select = document.getElementById('addCategory');
            select.innerHTML = categories[type].map(cat => `<option value="${cat}">${cat}</option>`).join('');
        }

        document.getElementById('addForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const month = parseInt(document.getElementById('addMonth').value);
            const type = document.getElementById('addType').value;
            const category = document.getElementById('addCategory').value;
            const description = document.getElementById('addDescription').value;
            const value = parseFloat(document.getElementById('addValue').value);

            const item = { 
                name: description || category, 
                value: value 
            };
            
            if (type === 'expense') {
                item.paid = false;
            }
            
            budgetData[month][type].push(item);
            saveData();
            refreshMonthView(month);
            closeAddModal();
            showToast(`${type === 'income' ? 'Receita' : 'Despesa'} adicionada`);
            
            if (month !== currentMonth) {
                showMonth(month);
            }
        });

        // Charts functionality
        function showCharts() {
            document.getElementById('budgetView').classList.remove('active');
            document.getElementById('chartsView').classList.add('active');
            updateCharts();
            updateYearStats();
        }

        function showBudget() {
            document.getElementById('chartsView').classList.remove('active');
            document.getElementById('budgetView').classList.add('active');
        }

        function updateYearStats() {
            let totalIncome = 0;
            let totalExpense = 0;
            
            for (let i = 0; i < 12; i++) {
                const totals = calculateMonthTotals(i);
                totalIncome += totals.totalIncome;
                totalExpense += totals.totalExpense;
            }
            
            document.getElementById('totalYearIncome').textContent = formatCurrency(totalIncome);
            document.getElementById('totalYearExpense').textContent = formatCurrency(totalExpense);
            document.getElementById('totalYearBalance').textContent = formatCurrency(totalIncome - totalExpense);
        }

        function updateCharts() {
            const incomeData = [];
            const expenseData = [];
            const isDark = currentTheme === 'dark';
            
            for (let i = 0; i < 12; i++) {
                const totals = calculateMonthTotals(i);
                incomeData.push(totals.totalIncome);
                expenseData.push(totals.totalExpense);
            }

            const chartOptions = {
                responsive: true,
                maintainAspectRatio: false,
                plugins: {
                    legend: {
                        labels: {
                            color: isDark ? '#94a3b8' : '#475569',
                            font: { size: 12 }
                        }
                    }
                },
                scales: {
                    y: {
                        beginAtZero: true,
                        ticks: {
                            color: isDark ? '#64748b' : '#64748b',
                            callback: function(value) {
                                return 'R$ ' + (value / 1000).toFixed(0) + 'k';
                            }
                        },
                        grid: {
                            color: isDark ? 'rgba(255, 255, 255, 0.05)' : 'rgba(0, 0, 0, 0.05)'
                        }
                    },
                    x: {
                        ticks: {
                            color: isDark ? '#64748b' : '#64748b'
                        },
                        grid: {
                            display: false
                        }
                    }
                }
            };

            // Income Chart
            const incomeCtx = document.getElementById('incomeChart').getContext('2d');
            if (incomeChart) incomeChart.destroy();
            
            incomeChart = new Chart(incomeCtx, {
                type: 'line',
                data: {
                    labels: months.map(m => m.substring(0, 3)),
                    datasets: [{
                        label: 'Receitas',
                        data: incomeData,
                        borderColor: '#059669',
                        backgroundColor: 'rgba(5, 150, 105, 0.1)',
                        borderWidth: 3,
                        fill: true,
                        tension: 0.4,
                        pointBackgroundColor: '#059669',
                        pointBorderColor: isDark ? '#fff' : '#fff',
                        pointBorderWidth: 2,
                        pointRadius: 5,
                        pointHoverRadius: 7
                    }]
                },
                options: chartOptions
            });

            // Expense Chart
            const expenseCtx = document.getElementById('expenseChart').getContext('2d');
            if (expenseChart) expenseChart.destroy();
            
            expenseChart = new Chart(expenseCtx, {
                type: 'line',
                data: {
                    labels: months.map(m => m.substring(0, 3)),
                    datasets: [{
                        label: 'Despesas',
                        data: expenseData,
                        borderColor: '#dc2626',
                        backgroundColor: 'rgba(220, 38, 38, 0.1)',
                        borderWidth: 3,
                        fill: true,
                        tension: 0.4,
                        pointBackgroundColor: '#dc2626',
                        pointBorderColor: isDark ? '#fff' : '#fff',
                        pointBorderWidth: 2,
                        pointRadius: 5,
                        pointHoverRadius: 7
                    }]
                },
                options: chartOptions
            });
        }

        // Close modal on outside click
        document.getElementById('addModal').addEventListener('click', function(e) {
            if (e.target === this) closeAddModal();
        });

        // Initialize
        init();

        // Register service worker
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('data:text/javascript;base64,' + btoa(`
                self.addEventListener('install', e => e.waitUntil(self.skipWaiting()));
                self.addEventListener('activate', e => e.waitUntil(self.clients.claim()));
                self.addEventListener('fetch', e => e.respondWith(fetch(e.request).catch(() => new Response('Offline'))));
            `)).catch(() => {});
        }
    </script>
</body>
</html>
